[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicefit"
version = "0.1.0"
description = "Fit text to a measured style profile, with verifiable preservation of facts, numbers, links and identifiers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "polycratia", email = "hey@polycratia.com" }]
maintainers = [{ name = "polycratia", email = "hey@polycratia.com" }]
keywords = ["style", "rewriting", "text", "nlp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://polycratia.com"
Repository = "https://github.com/polycratia/voicefit"
Issues = "https://github.com/polycratia/voicefit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/voicefit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
